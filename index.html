<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Temporarily Unavailable</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #12121a;
      --border:   #1e1e2e;
      --accent:   #f5a623;
      --accent2:  #e05a2b;
      --text:     #e8e8f0;
      --muted:    #6b6b80;
      --glow:     rgba(245, 166, 35, 0.15);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    /* animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      animation: gridShift 20s linear infinite;
      pointer-events: none;
    }

    @keyframes gridShift {
      from { transform: translateY(0); }
      to   { transform: translateY(60px); }
    }

    /* radial spotlight */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 40%, var(--glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      gap: 0;
    }

    /* top badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* icon */
    .icon-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 2rem;
    }

    .icon-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent2);
      animation: spin 3s linear infinite;
    }

    .icon-ring-2 {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-bottom-color: var(--muted);
      animation: spin 5s linear infinite reverse;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .icon-center {
      position: absolute;
      inset: 18px;
      background: var(--surface);
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    /* heading */
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    h1 span {
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 300;
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    /* progress bar */
    .progress-wrap {
      width: 320px;
      max-width: 90vw;
      margin-bottom: 2.5rem;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      animation: fillBar 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes fillBar {
      0%   { width: 0%; }
      100% { width: 73%; }
    }

    /* info cards */
    .cards {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--muted);
      transition: border-color 0.2s;
    }

    .card:hover { border-color: var(--accent); }
    .card-icon { font-size: 1.1rem; }

    /* footer */
    .footer {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      opacity: 0.5;
      position: fixed;
      bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="badge">
      <div class="badge-dot"></div>
      Temporarily Offline
    </div>

    <div class="icon-wrap">
      <div class="icon-ring"></div>
      <div class="icon-ring-2"></div>
      <div class="icon-center">🔧</div>
    </div>

    <h1>App is <span>Under<br>Construction</span></h1>
    <p class="sub">We're working on some improvements. The app will be back up shortly. Thank you for your patience.</p>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>PROGRESS</span>
        <span id="pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="cards">
      <div class="card"><span class="card-icon">⏱️</span> Back Soon</div>
      <div class="card"><span class="card-icon">🛡️</span> Data is Safe</div>
      <div class="card"><span class="card-icon">📲</span> Contact Admin</div>
    </div>

  </div>

  <div class="footer">NESTO HYPERMARKET · INTERNAL SYSTEM</div>

  <script>
    // animate percentage counter
    const pct = document.getElementById('pct');
    let val = 0;
    const target = 73;
    const interval = setInterval(() => {
      val++;
      pct.textContent = val + '%';
      if (val >= target) clearInterval(interval);
    }, 3000 / target);
  </script>
</body>
</html>
